<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PedalPulse | Next-Gen Cycle Lending</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .btn-history {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-history:hover {
      background: var(--accent);
      color: #000;
    }

    /* Cycle Grid */
    .section-title {
      font-size: 1.25rem;
      margin-bottom: 16px;
      color: var(--text-muted);
    }

    .cycle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .cycle-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .cycle-card:hover {
      transform: translateY(-4px);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      width: fit-content;
      margin-bottom: 12px;
    }

    .badge-available { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .badge-rented { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

    .price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      margin: 12px 0;
    }

    .btn-action {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-action:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-action:disabled {
      background: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .btn-return {
      background: var(--warning);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-return:hover {
      opacity: 0.9;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
    }

    .payment-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .pay-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .pay-btn.selected {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    /* History Table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">🚲 PedalPulse Kiosk</div>
      <button class="btn-history" onclick="toggleModal('history-modal')">📋 Booking History</button>
    </header>

    <div class="section-title">Select an Available Cycle</div>
    <div class="cycle-grid" id="cycle-container"></div>
  </div>

  <!-- Rent / Payment Modal -->
  <div class="modal-overlay" id="rent-modal">
    <div class="modal">
      <button class="modal-close" onclick="toggleModal('rent-modal')">✖</button>
      <h2 style="margin-bottom: 16px;" id="modal-cycle-title">Rent Cycle</h2>
      
      <form id="rent-form">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="user-name" placeholder="John Doe" required />
        </div>
        
        <div class="form-group">
          <label>Duration (Hours)</label>
          <input type="number" id="rent-hours" min="1" max="24" value="1" required onchange="calculateTotal()" />
        </div>

        <div class="form-group">
          <label>Payment Method</label>
          <div class="payment-options">
            <div class="pay-btn selected" onclick="selectPayment(this, 'UPI')">💳 UPI / QR</div>
            <div class="pay-btn" onclick="selectPayment(this, 'Card')">💳 Card</div>
            <div class="pay-btn" onclick="selectPayment(this, 'Cash')">💵 Cash</div>
          </div>
        </div>

        <div style="margin: 20px 0; display: flex; justify-content: space-between; align-items: center;">
          <span>Total Amount:</span>
          <span style="font-size: 1.5rem; font-weight: 700; color: var(--accent);" id="total-amount">$0</span>
        </div>

        <button type="submit" class="btn-action">Proceed & Pay</button>
      </form>
    </div>
  </div>

  <!-- History Modal -->
  <div class="modal-overlay" id="history-modal">
    <div class="modal" style="max-width: 750px;">
      <button class="modal-close" onclick="toggleModal('history-modal')">✖</button>
      <h2>Booking History & Active Rides</h2>
      
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Cycle</th>
              <th>Duration</th>
              <th>Payment</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="history-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Initial cycle state loaded from localStorage or default
    let cycles = JSON.parse(localStorage.getItem('cycle_list')) || [
      { id: 1, name: "Urban Cruiser 300", type: "City Bike", rate: 5, available: true },
      { id: 2, name: "TrailBlazer X", type: "Mountain Bike", rate: 8, available: true },
      { id: 3, name: "Volt E-Bike Pro", type: "Electric Bike", rate: 12, available: false },
      { id: 4, name: "Aero Speedster", type: "Road Bike", rate: 7, available: true }
    ];

    let selectedCycle = null;
    let selectedPaymentMethod = 'UPI';

    function saveCycleState() {
      localStorage.setItem('cycle_list', JSON.stringify(cycles));
    }

    function renderCycles() {
      const container = document.getElementById('cycle-container');
      container.innerHTML = cycles.map(cycle => `
        <div class="cycle-card">
          <div>
            <span class="badge ${cycle.available ? 'badge-available' : 'badge-rented'}">
              ${cycle.available ? 'Available' : 'Currently Rented'}
            </span>
            <h3>${cycle.name}</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem;">${cycle.type}</p>
            <div class="price">$${cycle.rate} <span style="font-size: 0.8rem; font-weight: 400; color: var(--text-muted);">/ hr</span></div>
          </div>
          <button 
            class="btn-action" 
            ${!cycle.available ? 'disabled' : ''} 
            onclick="openRentModal(${cycle.id})">
            ${cycle.available ? 'Rent Now' : 'Unavailable'}
          </button>
        </div>
      `).join('');
    }

    function toggleModal(id) {
      const modal = document.getElementById(id);
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function openRentModal(id) {
      selectedCycle = cycles.find(c => c.id === id);
      document.getElementById('modal-cycle-title').innerText = `Rent ${selectedCycle.name}`;
      calculateTotal();
      toggleModal('rent-modal');
    }

    function calculateTotal() {
      const hours = document.getElementById('rent-hours').value || 1;
      const total = selectedCycle ? selectedCycle.rate * hours : 0;
      document.getElementById('total-amount').innerText = `$${total}`;
    }

    function selectPayment(element, method) {
      document.querySelectorAll('.pay-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
      selectedPaymentMethod = method;
    }

    document.getElementById('rent-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const userName = document.getElementById('user-name').value;
      const hours = document.getElementById('rent-hours').value;
      const total = selectedCycle.rate * hours;

      // Update Cycle availability & persist state
      selectedCycle.available = false;
      saveCycleState();

      // Record History
      const history = JSON.parse(localStorage.getItem('cycle_history') || '[]');
      history.unshift({
        id: 'BK-' + Math.floor(1000 + Math.random() * 9000),
        cycleId: selectedCycle.id,
        user: userName,
        cycle: selectedCycle.name,
        hours: `${hours} hr(s)`,
        amount: `$${total}`,
        payment: selectedPaymentMethod,
        status: 'Active'
      });
      localStorage.setItem('cycle_history', JSON.stringify(history));

      // Reset and Refresh UI
      this.reset();
      toggleModal('rent-modal');
      renderCycles();
      renderHistory();
      alert('🔒 Payment Successful! Bike Unlocked. Enjoy your ride!');
    });

    function returnCycle(bookingId) {
      const history = JSON.parse(localStorage.getItem('cycle_history') || '[]');
      const booking = history.find(item => item.id === bookingId);

      if (booking && booking.status === 'Active') {
        // Update booking status
        booking.status = 'Returned';

        // Set cycle back to available
        const cycle = cycles.find(c => c.id === booking.cycleId);
        if (cycle) {
          cycle.available = true;
          saveCycleState();
        }

        // Save updated history
        localStorage.setItem('cycle_history', JSON.stringify(history));

        // Refresh UI
        renderCycles();
        renderHistory();
        alert(`🔓 ${booking.cycle} returned and locked successfully!`);
      }
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('cycle_history') || '[]');
      const container = document.getElementById('history-list');

      if (history.length === 0) {
        container.innerHTML = `<tr><td colspan="7" style="text-align:center; color: var(--text-muted);">No booking history found.</td></tr>`;
        return;
      }

      container.innerHTML = history.map(item => `
        <tr>
          <td><strong>${item.id}</strong></td>
          <td>${item.user}</td>
          <td>${item.cycle}</td>
          <td>${item.hours}</td>
          <td>${item.payment} (${item.amount})</td>
          <td>
            <span style="color: ${item.status === 'Active' ? 'var(--accent)' : 'var(--text-muted)'}; font-weight: 600;">
              ${item.status}
            </span>
          </td>
          <td>
            ${item.status === 'Active' 
              ? `<button class="btn-return" onclick="returnCycle('${item.id}')">Return Bike</button>` 
              : `<span style="color: var(--success); font-size: 0.85rem;">Completed</span>`}
          </td>
        </tr>
      `).join('');
    }

    // Initial Load
    renderCycles();
    renderHistory();
  </script>
</body>
</html>
