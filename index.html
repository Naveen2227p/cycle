<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PedalPulse | Next-Gen Cycle Lending</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-outline:hover {
      background: var(--accent);
      color: #000;
    }

    .btn-solid {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }

    .btn-solid:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    /* Category Filter Section */
    .filter-section {
      margin-bottom: 24px;
    }

    .filter-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .filter-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .sub-filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s;
    }

    .sub-filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .sub-filter-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* Cycle Grid */
    .section-title-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.25rem;
      color: var(--text-muted);
    }

    .count-badge {
      font-size: 0.85rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 12px;
      color: var(--accent);
    }

    .cycle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .cycle-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .cycle-card:hover {
      transform: translateY(-4px);
    }

    .cycle-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 1px solid var(--border);
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .badge-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-available { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .badge-rented { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .badge-category { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }

    .price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      margin: 12px 0;
    }

    .age-tag {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .btn-action {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-action:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-action:disabled {
      background: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .btn-return {
      background: var(--warning);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-return:hover {
      opacity: 0.9;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
    }

    .payment-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .pay-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .pay-btn.selected {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .auth-toggle {
      text-align: center;
      margin-top: 16px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-toggle span {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }

    /* History Table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">🚲 PedalPulse Kiosk</div>
      <div class="header-actions">
        <button class="btn-outline" onclick="toggleModal('history-modal')">📋 Booking History</button>
        <div id="auth-header-slot">
          <button class="btn-solid" onclick="openAuthModal('login')">Login / Sign Up</button>
        </div>
      </div>
    </header>

    <!-- Category Filters -->
    <div class="filter-section">
      <div class="filter-label">Select Age Category</div>
      <div class="filter-container">
        <button class="filter-btn active" onclick="filterCategory('All', this)">All Cycles</button>
        <button class="filter-btn" onclick="filterCategory('Adults', this)">👨‍💼 Adults (18+)</button>
        <button class="filter-btn" onclick="filterCategory('Children', this)">🧒 Children (3-17)</button>
        <button class="filter-btn" onclick="filterCategory('Senior Citizens', this)">🧓 Senior Citizens (60+)</button>
      </div>
    </div>

    <!-- Dynamic Sub-Age Group Filters -->
    <div class="filter-section" id="sub-filter-wrapper" style="display: none;">
      <div class="filter-label">Filter by Specific Age Bracket</div>
      <div class="filter-container" id="sub-filter-container"></div>
    </div>

    <div class="section-title-wrapper">
      <div class="section-title" id="display-title">Available Cycles</div>
      <span class="count-badge" id="cycle-count">0 Bikes Available</span>
    </div>

    <div class="cycle-grid" id="cycle-container"></div>
  </div>

  <!-- Auth Modal (Login / Sign Up) -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <button class="modal-close" onclick="toggleModal('auth-modal')">✖</button>
      <h2 style="margin-bottom: 16px;" id="auth-modal-title">Account Login</h2>
      
      <form id="auth-form">
        <div class="form-group" id="name-field-group" style="display: none;">
          <label>Full Name</label>
          <input type="text" id="auth-name" placeholder="John Doe" />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="auth-email" placeholder="user@example.com" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="auth-password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-action" id="auth-submit-btn">Login</button>

        <div class="auth-toggle">
          <p id="auth-toggle-text">Don't have an account? <span onclick="switchAuthMode()">Sign Up</span></p>
        </div>
      </form>
    </div>
  </div>

  <!-- Rent / Payment Modal -->
  <div class="modal-overlay" id="rent-modal">
    <div class="modal">
      <button class="modal-close" onclick="toggleModal('rent-modal')">✖</button>
      <h2 style="margin-bottom: 16px;" id="modal-cycle-title">Rent Cycle</h2>
      
      <form id="rent-form">
        <div class="form-group">
          <label>Rider Name</label>
          <input type="text" id="user-name" placeholder="John Doe" required />
        </div>
        
        <div class="form-group">
          <label>Duration (Hours)</label>
          <input type="number" id="rent-hours" min="1" max="24" value="1" required onchange="calculateTotal()" />
        </div>

        <div class="form-group">
          <label>Payment Method</label>
          <div class="payment-options">
            <div class="pay-btn selected" onclick="selectPayment(this, 'UPI')">💳 UPI / QR</div>
            <div class="pay-btn" onclick="selectPayment(this, 'Card')">💳 Card</div>
            <div class="pay-btn" onclick="selectPayment(this, 'Cash')">💵 Cash</div>
          </div>
        </div>

        <div style="margin: 20px 0; display: flex; justify-content: space-between; align-items: center;">
          <span>Total Amount:</span>
          <span style="font-size: 1.5rem; font-weight: 700; color: var(--accent);" id="total-amount">$0</span>
        </div>

        <button type="submit" class="btn-action">Proceed & Pay</button>
      </form>
    </div>
  </div>

  <!-- History Modal -->
  <div class="modal-overlay" id="history-modal">
    <div class="modal" style="max-width: 750px;">
      <button class="modal-close" onclick="toggleModal('history-modal')">✖</button>
      <h2>Booking History & Active Rides</h2>
      
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Cycle</th>
              <th>Duration</th>
              <th>Payment</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="history-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Expanded cycle database with images and explicit age brackets
    const defaultCycles = [
      // Children Models (Age 3 - 17)
      { id: 1, name: "TinyTots Balance 12", category: "Children", ageBracket: "3-5", ageGroup: "Age: 3 - 5 yrs", type: "Balance Bike", rate: 2, available: true, image: "https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=500&auto=format&fit=crop" },
      { id: 2, name: "Mini Rider 16", category: "Children", ageBracket: "5-8", ageGroup: "Age: 5 - 8 yrs", type: "Training Wheels Bike", rate: 3, available: true, image: "https://images.unsplash.com/photo-1507035895480-2b3156c31fc8?w=500&auto=format&fit=crop" },
      { id: 3, name: "Junior Speedster 20", category: "Children", ageBracket: "8-12", ageGroup: "Age: 8 - 12 yrs", type: "Kids Sports Bike", rate: 4, available: true, image: "https://images.unsplash.com/photo-1532298229144-0ec0c57515c7?w=500&auto=format&fit=crop" },
      { id: 4, name: "Blaze BMX 24", category: "Children", ageBracket: "12-17", ageGroup: "Age: 12 - 17 yrs", type: "Freestyle BMX", rate: 5, available: true, image: "https://images.unsplash.com/photo-1511994298241-608e28f14fde?w=500&auto=format&fit=crop" },

      // Adult Models (Age 18+)
      { id: 5, name: "Urban Cruiser 300", category: "Adults", ageBracket: "18-35", ageGroup: "Age: 18 - 35 yrs", type: "City Commuter", rate: 5, available: true, image: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=500&auto=format&fit=crop" },
      { id: 6, name: "TrailBlazer X", category: "Adults", ageBracket: "18-35", ageGroup: "Age: 18 - 35 yrs", type: "Mountain Bike", rate: 8, available: true, image: "https://images.unsplash.com/photo-1576435728678-68d0fbf94e91?w=500&auto=format&fit=crop" },
      { id: 7, name: "Volt E-Bike Pro", category: "Adults", ageBracket: "36-59", ageGroup: "Age: 36 - 59 yrs", type: "Electric Bike", rate: 12, available: true, image: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500&auto=format&fit=crop" },
      { id: 8, name: "Aero Speedster", category: "Adults", ageBracket: "18-35", ageGroup: "Age: 18 - 35 yrs", type: "Road Racing Bike", rate: 7, available: true, image: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=500&auto=format&fit=crop" },

      // Senior Citizens Models (Age 60+)
      { id: 9, name: "Comfort Cruise Trike", category: "Senior Citizens", ageBracket: "60+", ageGroup: "Age: 60+ yrs", type: "3-Wheel Electric Trike", rate: 6, available: true, image: "https://images.unsplash.com/photo-1505705694340-019e1e335916?w=500&auto=format&fit=crop" },
      { id: 10, name: "EasyStep Low-Entry", category: "Senior Citizens", ageBracket: "60+", ageGroup: "Age: 60+ yrs", type: "Ergonomic Step-Through", rate: 5, available: true, image: "https://images.unsplash.com/photo-1511994298241-608e28f14fde?w=500&auto=format&fit=crop" },
      { id: 11, name: "Serenity Glide E-Trike", category: "Senior Citizens", ageBracket: "65+", ageGroup: "Age: 65+ yrs", type: "Dual-Basket Comfort Trike", rate: 7, available: true, image: "https://images.unsplash.com/photo-1507035895480-2b3156c31fc8?w=500&auto=format&fit=crop" }
    ];

    let currentCategory = 'All';
    let currentAgeBracket = 'All';
    let authMode = 'login';
    let currentUser = JSON.parse(localStorage.getItem('pedal_user')) || null;

    function getCycles() {
      const saved = localStorage.getItem('cycle_list');
      if (!saved) return defaultCycles;
      return JSON.parse(saved);
    }

    function saveCycles(cycles) {
      localStorage.setItem('cycle_list', JSON.stringify(cycles));
    }

    let selectedCycle = null;
    let selectedPaymentMethod = 'UPI';

    /* --- Auth Logic --- */
    function updateAuthHeader() {
      const slot = document.getElementById('auth-header-slot');
      if (currentUser) {
        slot.innerHTML = `
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 0.9rem; color: var(--text-muted);">Hi, <strong>${currentUser.name}</strong></span>
            <button class="btn-solid" style="background: var(--border); color: var(--text);" onclick="logout()">Logout</button>
          </div>
        `;
      } else {
        slot.innerHTML = `<button class="btn-solid" onclick="openAuthModal('login')">Login / Sign Up</button>`;
      }
    }

    function openAuthModal(mode) {
      authMode = mode;
      const title = document.getElementById('auth-modal-title');
      const submitBtn = document.getElementById('auth-submit-btn');
      const nameGroup = document.getElementById('name-field-group');
      const toggleText = document.getElementById('auth-toggle-text');

      if (authMode === 'signup') {
        title.innerText = 'Create Account';
        submitBtn.innerText = 'Sign Up';
        nameGroup.style.display = 'block';
        toggleText.innerHTML = `Already have an account? <span onclick="switchAuthMode()">Login</span>`;
      } else {
        title.innerText = 'Account Login';
        submitBtn.innerText = 'Login';
        nameGroup.style.display = 'none';
        toggleText.innerHTML = `Don't have an account? <span onclick="switchAuthMode()">Sign Up</span>`;
      }

      toggleModal('auth-modal');
    }

    function switchAuthMode() {
      const isLogin = authMode === 'login';
      toggleModal('auth-modal');
      openAuthModal(isLogin ? 'signup' : 'login');
    }

    document.getElementById('auth-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const name = document.getElementById('auth-name').value || email.split('@')[0];

      currentUser = { name: name, email: email };
      localStorage.setItem('pedal_user', JSON.stringify(currentUser));

      updateAuthHeader();
      toggleModal('auth-modal');
      this.reset();
      alert(`Welcome ${currentUser.name}! You are now logged in.`);
    });

    function logout() {
      currentUser = null;
      localStorage.removeItem('pedal_user');
      updateAuthHeader();
      alert('Logged out successfully.');
    }

    /* --- Category & Sub-Filter Logic --- */
    function filterCategory(category, buttonElement) {
      currentCategory = category;
      currentAgeBracket = 'All'; // Reset sub-bracket

      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');

      renderSubFilters();
      renderCycles();
    }

    function filterAgeBracket(bracket, buttonElement) {
      currentAgeBracket = bracket;
      document.querySelectorAll('.sub-filter-btn').forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');
      renderCycles();
    }

    function renderSubFilters() {
      const wrapper = document.getElementById('sub-filter-wrapper');
      const container = document.getElementById('sub-filter-container');

      if (currentCategory === 'All') {
        wrapper.style.display = 'none';
        return;
      }

      const cycles = getCycles().filter(c => c.category === currentCategory);
      const brackets = ['All', ...new Set(cycles.map(c => c.ageBracket))];

      wrapper.style.display = 'block';
      container.innerHTML = brackets.map(b => `
        <button 
          class="sub-filter-btn ${b === currentAgeBracket ? 'active' : ''}" 
          onclick="filterAgeBracket('${b}', this)">
          ${b === 'All' ? 'All Ages in Category' : 'Age ' + b + ' yrs'}
        </button>
      `).join('');
    }

    function renderCycles() {
      const cycles = getCycles();
      
      // Filter by Main Category
      let filtered = currentCategory === 'All' 
        ? cycles 
        : cycles.filter(c => c.category === currentCategory);

      // Filter by Sub-Age Bracket if selected
      if (currentAgeBracket !== 'All') {
        filtered = filtered.filter(c => c.ageBracket === currentAgeBracket);
      }

      const container = document.getElementById('cycle-container');
      const displayTitle = document.getElementById('display-title');
      const cycleCount = document.getElementById('cycle-count');

      displayTitle.innerText = currentCategory === 'All' ? 'All Available Cycles' : `${currentCategory} Cycles`;
      
      const availableCount = filtered.filter(c => c.available).length;
      cycleCount.innerText = `${availableCount} Available / ${filtered.length} Total`;

      if (filtered.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 40px 0;">No cycle models found matching the selected age group.</p>`;
        return;
      }

      container.innerHTML = filtered.map(cycle => `
        <div class="cycle-card">
          <img src="${cycle.image}" alt="${cycle.name}" class="cycle-img" onerror="this.src='https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=500&auto=format&fit=crop'" />
          <div class="card-body">
            <div>
              <div class="badge-wrapper">
                <span class="badge ${cycle.available ? 'badge-available' : 'badge-rented'}">
                  ${cycle.available ? 'Available' : 'Currently Rented'}
                </span>
                <span class="badge badge-category">${cycle.category}</span>
              </div>
              <h3>${cycle.name}</h3>
              <p style="color: var(--text-muted); font-size: 0.85rem;">${cycle.type}</p>
              <div class="age-tag">🎯 ${cycle.ageGroup}</div>
              <div class="price">$${cycle.rate} <span style="font-size: 0.8rem; font-weight: 400; color: var(--text-muted);">/ hr</span></div>
            </div>
            <button 
              class="btn-action" 
              ${!cycle.available ? 'disabled' : ''} 
              onclick="openRentModal(${cycle.id})">
              ${cycle.available ? 'Rent Now' : 'Rented Out'}
            </button>
          </div>
        </div>
      `).join('');
    }

    function toggleModal(id) {
      const modal = document.getElementById(id);
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function openRentModal(id) {
      const cycles = getCycles();
      selectedCycle = cycles.find(c => c.id === id);
      document.getElementById('modal-cycle-title').innerText = `Rent ${selectedCycle.name}`;
      
      if (currentUser) {
        document.getElementById('user-name').value = currentUser.name;
      }

      calculateTotal();
      toggleModal('rent-modal');
    }

    function calculateTotal() {
      const hours = document.getElementById('rent-hours').value || 1;
      const total = selectedCycle ? selectedCycle.rate * hours : 0;
      document.getElementById('total-amount').innerText = `$${total}`;
    }

    function selectPayment(element, method) {
      document.querySelectorAll('.pay-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
      selectedPaymentMethod = method;
    }

    document.getElementById('rent-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const userName = document.getElementById('user-name').value;
      const hours = document.getElementById('rent-hours').value;
      const total = selectedCycle.rate * hours;

      // 1. Mark cycle as rented
      const cycles = getCycles();
      const cycleToUpdate = cycles.find(c => c.id === selectedCycle.id);
      if (cycleToUpdate) {
        cycleToUpdate.available = false;
        saveCycles(cycles);
      }

      // 2. Add booking to history
      const history = JSON.parse(localStorage.getItem('cycle_history') || '[]');
      history.unshift({
        id: 'BK-' + Math.floor(1000 + Math.random() * 9000),
        cycleId: selectedCycle.id,
        user: userName,
        cycle: selectedCycle.name,
        hours: `${hours} hr(s)`,
        amount: `$${total}`,
        payment: selectedPaymentMethod,
        status: 'Active'
      });
      localStorage.setItem('cycle_history', JSON.stringify(history));

      // 3. Reset UI
      this.reset();
      toggleModal('rent-modal');
      renderCycles();
      renderHistory();
      alert('🔒 Payment Successful! Bike Unlocked. Enjoy your ride!');
    });

    function returnCycle(bookingId) {
      const history = JSON.parse(localStorage.getItem('cycle_history') || '[]');
      const booking = history.find(item => item.id === bookingId);

      if (booking && booking.status === 'Active') {
        booking.status = 'Returned';
        localStorage.setItem('cycle_history', JSON.stringify(history));

        const cycles = getCycles();
        const cycle = cycles.find(c => c.id === booking.cycleId);
        if (cycle) {
          cycle.available = true;
          saveCycles(cycles);
        }

        renderCycles();
        renderHistory();
        alert(`🔓 ${booking.cycle} has been returned successfully! It is now available for the next rider.`);
      }
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('cycle_history') || '[]');
      const container = document.getElementById('history-list');

      if (history.length === 0) {
        container.innerHTML = `<tr><td colspan="7" style="text-align:center; color: var(--text-muted);">No booking history found.</td></tr>`;
        return;
      }

      container.innerHTML = history.map(item => `
        <tr>
          <td><strong>${item.id}</strong></td>
          <td>${item.user}</td>
          <td>${item.cycle}</td>
          <td>${item.hours}</td>
          <td>${item.payment} (${item.amount})</td>
          <td>
            <span style="color: ${item.status === 'Active' ? 'var(--accent)' : 'var(--success)'}; font-weight: 600;">
              ${item.status}
            </span>
          </td>
          <td>
            ${item.status === 'Active' 
              ? `<button class="btn-return" onclick="returnCycle('${item.id}')">Complete Ride & Lock</button>` 
              : `<span style="color: var(--text-muted); font-size: 0.85rem;">Completed</span>`}
          </td>
        </tr>
      `).join('');
    }

    // Initial Load
    updateAuthHeader();
    renderCycles();
    renderHistory();
  </script>
</body>
</html>
