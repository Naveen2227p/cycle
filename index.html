<!-- Booking History Section -->
<section id="booking-history" style="max-width: 800px; margin: 40px auto; padding: 20px; font-family: Arial, sans-serif;">
  <h2>Booking History</h2>
  <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
    <thead>
      <tr style="background-color: #f2f2f2; text-align: left;">
        <th style="padding: 10px; border-bottom: 2px solid #ddd;">Booking ID</th>
        <th style="padding: 10px; border-bottom: 2px solid #ddd;">Cycle Name</th>
        <th style="padding: 10px; border-bottom: 2px solid #ddd;">Date</th>
        <th style="padding: 10px; border-bottom: 2px solid #ddd;">Status</th>
      </tr>
    </thead>
    <tbody id="history-table-body">
      <!-- Dynamic rows inserted here -->
    </tbody>
  </table>
</section>

<script>
  // Sample booking history data
  const bookingHistory = [
    { id: "BK-1001", cycle: "Mountain Bike X1", date: "2026-09-20", status: "Completed" },
    { id: "BK-1002", cycle: "City Cruiser", date: "2026-09-22", status: "Active" },
    { id: "BK-1003", cycle: "Road Racer 3000", date: "2026-09-24", status: "Pending" }
  ];

  const tableBody = document.getElementById("history-table-body");

  bookingHistory.forEach(item => {
    const row = document.createElement("tr");
    row.style.borderBottom = "1px solid #ddd";

    row.innerHTML = `
      <td style="padding: 10px;">${item.id}</td>
      <td style="padding: 10px;">${item.cycle}</td>
      <td style="padding: 10px;">${item.date}</td>
      <td style="padding: 10px; font-weight: bold; color: ${
        item.status === "Completed" ? "green" : item.status === "Active" ? "blue" : "orange"
      };">${item.status}</td>
    `;

    tableBody.appendChild(row);
  });
</script>
