<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cycle Lending Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #334155;
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #0f172a;
      font-size: 1.75rem;
      margin-bottom: 20px;
    }

    /* Cards */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      font-size: 1.25rem;
      color: #1e293b;
      margin-bottom: 16px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 8px;
    }

    /* Responsive Grid for Cycle Showcase */
    .cycle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .cycle-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cycle-card h4 {
      font-size: 1rem;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .badge {
      display: inline-block;
      align-self: flex-start;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-available { background-color: #dcfce7; color: #15803d; }
    .badge-rented { background-color: #fef3c7; color: #b45309; }

    /* Responsive Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .form-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #2563eb;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 16px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    /* Filter Controls */
    .filter-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background-color: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    /* Responsive Table Wrapper */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 550px; /* Prevents squishing on mobile screens */
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.9rem;
    }

    th {
      background-color: #f8fafc;
      color: #64748b;
      font-weight: 600;
    }

    .status-Completed { color: #16a34a; font-weight: 600; }
    .status-Active { color: #2563eb; font-weight: 600; }

    .btn-cancel {
      padding: 4px 8px;
      border: 1px solid #ef4444;
      background: #fef2f2;
      color: #dc2626;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚲 Cycle Lending Portal</h1>

    <!-- Cycles Available -->
    <div class="card">
      <h2>Available Cycles</h2>
      <div class="cycle-grid">
        <div class="cycle-card">
          <div>
            <h4>Mountain Bike X1</h4>
            <p style="font-size: 0.875rem; color: #64748b;">Rate: $5/hr</p>
          </div>
          <span class="badge badge-available">Available</span>
        </div>
        <div class="cycle-card">
          <div>
            <h4>City Cruiser 2000</h4>
            <p style="font-size: 0.875rem; color: #64748b;">Rate: $3/hr</p>
          </div>
          <span class="badge badge-available">Available</span>
        </div>
        <div class="cycle-card">
          <div>
            <h4>Road Racer 3000</h4>
            <p style="font-size: 0.875rem; color: #64748b;">Rate: $7/hr</p>
          </div>
          <span class="badge badge-rented">Rented</span>
        </div>
      </div>
    </div>

    <!-- Booking Form -->
    <div class="card">
      <h2>Book a Cycle</h2>
      <form id="booking-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="user-name">Your Name</label>
            <input type="text" id="user-name" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label for="cycle-select">Select Cycle</label>
            <select id="cycle-select" required>
              <option value="">Choose Cycle</option>
              <option value="Mountain Bike X1">Mountain Bike X1</option>
              <option value="City Cruiser 2000">City Cruiser 2000</option>
              <option value="Road Racer 3000">Road Racer 3000</option>
            </select>
          </div>
          <div class="form-group">
            <label for="booking-date">Date</label>
            <input type="date" id="booking-date" required />
          </div>
        </div>
        <button type="submit" class="btn-submit">Confirm Booking</button>
      </form>
    </div>

    <!-- Booking History -->
    <div class="card">
      <h2>Booking History</h2>
      <div class="filter-group">
        <button class="filter-btn active" onclick="filterHistory('All', this)">All</button>
        <button class="filter-btn" onclick="filterHistory('Active', this)">Active</button>
        <button class="filter-btn" onclick="filterHistory('Completed', this)">Completed</button>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Cycle</th>
              <th>Date</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <!-- Dynamic Content -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const initialBookings = [
      { id: "BK-1001", user: "Alex Johnson", cycle: "Mountain Bike X1", date: "2026-09-20", status: "Completed" },
      { id: "BK-1002", user: "Maria Garcia", cycle: "City Cruiser 2000", date: "2026-09-24", status: "Active" }
    ];

    let bookings = JSON.parse(localStorage.getItem('cycle_bookings')) || initialBookings;

    document.getElementById('booking-date').valueAsDate = new Date();

    function renderHistory(filter = 'All') {
      const tableBody = document.getElementById("history-table-body");
      tableBody.innerHTML = "";

      const filteredBookings = bookings.filter(item => filter === 'All' || item.status === filter);

      if (filteredBookings.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">No bookings found.</td></tr>`;
        return;
      }

      filteredBookings.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><strong>${item.id}</strong></td>
          <td>${item.user}</td>
          <td>${item.cycle}</td>
          <td>${item.date}</td>
          <td class="status-${item.status}">${item.status}</td>
          <td>
            ${item.status === 'Active' 
              ? `<button class="btn-cancel" onclick="cancelBooking('${item.id}')">Complete</button>` 
              : '-'}
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    document.getElementById("booking-form").addEventListener("submit", function(e) {
      e.preventDefault();

      const newBooking = {
        id: "BK-" + Math.floor(1000 + Math.random() * 9000),
        user: document.getElementById("user-name").value,
        cycle: document.getElementById("cycle-select").value,
        date: document.getElementById("booking-date").value,
        status: "Active"
      };

      bookings.unshift(newBooking);
      localStorage.setItem('cycle_bookings', JSON.stringify(bookings));
      this.reset();
      document.getElementById('booking-date').valueAsDate = new Date();
      renderHistory();
    });

    function cancelBooking(id) {
      bookings = bookings.map(b => b.id === id ? {...b, status: 'Completed'} : b);
      localStorage.setItem('cycle_bookings', JSON.stringify(bookings));
      renderHistory();
    }

    function filterHistory(status, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHistory(status);
    }

    renderHistory();
  </script>

</body>
</html>
